<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07100d">
  <meta name="description" content="یک پیام کوچک و دوست‌داشتنی از EMPY">
  <title>یک راز | Surprise by EMPY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <section class="surprise-card" aria-labelledby="page-title">
      <div class="brand-mark" aria-label="EMPY">
        <span class="brand-crown">♛</span>
        <span class="brand-name">EMPY</span>
      </div>

      <div class="gift" aria-hidden="true">
        <div class="gift-lid"></div>
        <div class="gift-box"><span></span></div>
        <div class="spark spark-one">✦</div>
        <div class="spark spark-two">·</div>
        <div class="spark spark-three">✧</div>
      </div>

      <div class="eyebrow">SURPRISE</div>
      <h1 id="page-title">می‌خوای یه راز بدونی؟</h1>
      <p class="subtitle">یک پیام کوچک و دوست‌داشتنی</p>

      <div class="actions" id="actions">
        <button class="button button-primary" id="yes-button" type="button">بله، بگو</button>
        <button class="button button-quiet" id="no-button" type="button">فعلاً نه</button>
      </div>

      <div class="reveal" id="reveal" aria-live="polite" hidden>
        <div class="reveal-icon">✦</div>
        <p>راز بزرگ اینه: خیلی وقت‌ها یک قدم کوچک، شروع یک اتفاق بزرگه.</p>
        <button class="reset-button" id="reset-button" type="button">دوباره امتحان کن</button>
      </div>

      <p class="signature">برای لحظه‌ای لبخند، از EMPY</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
