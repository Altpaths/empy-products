<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="دفتر ساده و محلی برای نگهداری اطلاعات پروژه‌ها">
<title>Project Vault | دفتر پروژه‌ها</title>
<style>
:root{
  --bg:#0c0f14;--surface:#151a22;--surface-2:#1b222c;--surface-3:#222b37;
  --border:#2b3542;--text:#f1efe8;--muted:#9aa4b2;--faint:#657080;
  --gold:#d1a92e;--gold-soft:#9f8122;--green:#39c58b;--amber:#e3a34e;--red:#e06460;
  --radius:14px;--small-radius:9px;--sans:Tahoma,"Vazirmatn",sans-serif;--mono:"SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans)}
body{background:radial-gradient(circle at 10% 0%,rgba(209,169,46,.08),transparent 34%),radial-gradient(circle at 95% 95%,rgba(57,197,139,.06),transparent 38%),var(--bg)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:1rem 1.4rem;background:rgba(12,15,20,.94);border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:.7rem;margin-left:auto}
.brand-mark{width:38px;height:38px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:11px;font-weight:800;letter-spacing:-.5px;box-shadow:0 0 0 4px rgba(209,169,46,.08)}
.brand h1{font-size:15px;margin:0 0 .15rem;font-weight:800}.brand small{display:block;color:var(--muted);font-size:11px}
.top-actions{display:flex;gap:.45rem;flex-wrap:wrap}.btn{border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text);padding:.55rem .85rem;font-size:12px;transition:.15s}.btn:hover{border-color:var(--gold-soft);background:var(--surface-2)}.btn-primary{background:var(--gold);border-color:var(--gold);color:#171305;font-weight:700}.btn-primary:hover{background:#e0b83a}.btn-quiet{color:var(--muted)}.btn-danger{color:var(--red)}
.save-state{display:flex;align-items:center;gap:.35rem;color:var(--muted);font-size:11px;margin-right:.4rem}.save-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}.save-dot.warn{background:var(--amber)}
.app{display:grid;grid-template-columns:285px minmax(0,920px);direction:ltr;min-height:calc(100vh - 73px);max-width:1280px;margin:0 auto}.sidebar,.main{direction:rtl}.sidebar{border-left:1px solid var(--border);padding:1rem;min-height:calc(100vh - 73px);background:rgba(14,18,24,.5)}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:.7rem;margin-bottom:.8rem}.side-head h2{font-size:15px;margin:0 0 .2rem}.side-count{font-size:11px;color:var(--muted)}
.search{width:100%;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text);padding:.6rem .85rem;font-size:12px;margin-bottom:1rem}.search::placeholder{color:var(--faint)}
.project-list{display:grid;gap:.55rem}.sidebar-empty{text-align:center;color:var(--faint);font-size:12px;line-height:1.8;padding:2rem .5rem}.project-item{border:1px solid var(--border);border-radius:var(--small-radius);background:var(--surface);padding:.75rem .8rem;cursor:pointer;transition:.15s}.project-item:hover{border-color:var(--gold-soft);transform:translateY(-1px)}.project-item.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}.project-name{font-weight:700;font-size:13px;margin-bottom:.25rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.project-meta{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badges{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.55rem}.badge{padding:.15rem .45rem;border-radius:999px;border:1px solid var(--border);color:var(--muted);font-size:10px}.badge.active{color:var(--green);border-color:rgba(57,197,139,.4)}.badge.planning{color:var(--gold);border-color:rgba(209,169,46,.4)}.badge.paused{color:var(--amber);border-color:rgba(227,163,78,.4)}.badge.archived{color:var(--faint)}
.main{padding:1.5rem 2rem 4rem;min-width:0}.empty{min-height:65vh;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty-inner{max-width:390px}.empty-mark{width:76px;height:76px;margin:0 auto 1rem;border:1px dashed var(--gold-soft);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:25px}.empty h2{font-size:18px;color:var(--text);margin:.4rem 0}.empty p{font-size:12px;line-height:1.9;margin:.5rem 0 1rem}
.project-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1rem}.project-head-main{min-width:0;flex:1}.name-input{width:100%;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--text);font-size:25px;font-weight:800;padding:.1rem 0}.name-input:focus{border-color:var(--gold);outline:0}.desc-input{width:100%;border:0;background:transparent;color:var(--muted);resize:vertical;min-height:30px;padding:.35rem 0;font-size:12.5px;line-height:1.8}.desc-input:focus{outline:0}.project-head-actions{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.65rem;margin-bottom:1rem}.card{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:1rem;margin-bottom:.85rem}.quick-card{padding:.75rem}.quick-card label,.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:.35rem}.quick-card strong{display:block;font-size:13px}.quick-card small{display:block;color:var(--faint);font-size:10px;margin-top:.2rem}.status-active{color:var(--green)}.status-planning{color:var(--gold)}.status-paused{color:var(--amber)}.status-archived{color:var(--muted)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:.7rem;margin-bottom:.8rem}.card-head h3{font-size:14px;margin:0}.card-head p{font-size:11px;color:var(--muted);margin:0}.card-icon{color:var(--gold)}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}.field{min-width:0}.field.full{grid-column:1/-1}.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);border-radius:var(--small-radius);background:var(--bg);color:var(--text);padding:.6rem .7rem;font-size:12px}.field textarea{min-height:78px;resize:vertical;line-height:1.7}.field input::placeholder,.field textarea::placeholder{color:var(--faint)}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold-soft);outline:0}.password-wrap{position:relative}.password-wrap input{padding-left:4.6rem;font-family:var(--mono)}.password-actions{position:absolute;left:.35rem;top:50%;transform:translateY(-50%);display:flex;gap:.1rem}.icon-btn{border:0;background:transparent;color:var(--muted);padding:.25rem;font-size:12px;border-radius:5px}.icon-btn:hover{color:var(--gold);background:rgba(209,169,46,.1)}
.technical{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:.85rem;overflow:hidden}.technical summary{list-style:none;display:flex;align-items:center;gap:.55rem;padding:1rem;cursor:pointer;font-size:14px;font-weight:700;background:var(--surface-2)}.technical summary::-webkit-details-marker{display:none}.technical summary::after{content:'＋';margin-right:auto;color:var(--gold);font-size:15px}.technical[open] summary::after{content:'－'}.technical-body{padding:1rem;border-top:1px solid var(--border)}.technical-group{border-top:1px solid var(--border);padding-top:.9rem;margin-top:.9rem}.technical-group:first-child{border-top:0;padding-top:0;margin-top:0}.technical-group h4{margin:0 0 .65rem;font-size:12px;color:var(--gold)}
.notes textarea{min-height:130px}.local-note{padding:.7rem .8rem;border:1px solid rgba(57,197,139,.25);border-radius:var(--small-radius);background:rgba(57,197,139,.06);color:#b8dacc;font-size:11px;line-height:1.8;margin-top:.8rem}.danger-zone{display:flex;justify-content:flex-start;margin-top:1rem}.footer-note{color:var(--faint);font-size:10px;margin-top:1rem}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--surface-3);border:1px solid var(--gold-soft);border-radius:999px;color:var(--text);font-size:12px;padding:.6rem 1rem;transition:.2s;z-index:40}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:1rem;background:rgba(4,6,9,.78);backdrop-filter:blur(4px)}.modal{width:min(390px,100%);border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:1.2rem}.modal h3{font-size:15px;margin:0 0 .5rem}.modal p{font-size:11px;line-height:1.8;color:var(--muted);margin:0 0 .8rem}.modal input{width:100%;border:1px solid var(--border);border-radius:var(--small-radius);background:var(--bg);color:var(--text);padding:.65rem;font-family:var(--mono);margin-bottom:.8rem}.modal-actions{display:flex;gap:.4rem;justify-content:flex-start}
@media(max-width:900px){.app{grid-template-columns:235px 1fr}.main{padding:1.2rem}.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.topbar{padding:.8rem 1rem}.brand{width:100%;margin-left:0}.top-actions{width:100%}.top-actions .btn{flex:1;justify-content:center}.save-state{margin-right:auto}.app{display:block}.sidebar{min-height:0;border-left:0;border-bottom:1px solid var(--border);padding:.8rem}.project-list{display:flex;overflow-x:auto;padding-bottom:.2rem}.project-item{min-width:190px}.main{padding:1rem}.project-head{display:block}.project-head-actions{justify-content:flex-start;margin-top:.6rem}.field-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.quick-card{min-height:70px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">PV</div>
    <div><h1>دفتر پروژه‌ها</h1><small>Project Vault · ذخیره‌سازی محلی</small></div>
  </div>
  <div class="top-actions">
    <button class="btn btn-quiet" id="btn-export" type="button">📤 خروجی رمزگذاری‌شده</button>
    <button class="btn btn-quiet" id="btn-import" type="button">📥 بازیابی</button>
    <input id="file-input" type="file" accept=".vault,.json,application/json" hidden>
  </div>
  <div class="save-state" id="save-state"><span class="save-dot"></span><span>آماده</span></div>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="side-head">
      <div><h2>پروژه‌ها</h2><span class="side-count" id="project-count">۰ پروژه</span></div>
      <button class="btn btn-primary" id="btn-new" type="button">＋ جدید</button>
    </div>
    <input class="search" id="search" type="search" placeholder="جستجوی پروژه..." aria-label="جستجوی پروژه">
    <div class="project-list" id="project-list"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const STORAGE_KEY = 'empy-project-vault-v1';
const STATUS_LABELS = {active:'در حال انجام',planning:'در برنامه',paused:'متوقف',archived:'آرشیو'};
const STATUS_CLASS = {active:'active',planning:'planning',paused:'paused',archived:'archived'};
const storage = (()=>{ try{return window.localStorage;}catch{return null;} })();
let projects = loadProjects();
let selectedId = projects[0]?.id || null;
let searchTerm = '';
let saveTimer = null;

function uid(){return 'p_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function blankProject(name){return {id:uid(),name:name||'پروژه بدون نام',status:'active',description:'',nextDate:'',nextAction:'',links:{site:'',repo:'',admin:''},access:{label:'ورود اصلی',url:'',username:'',password:''},technical:{domain:{name:'',registrar:'',purchaseDate:'',renewDate:'',duration:'',panelUrl:'',username:'',password:''},hosting:{provider:'',purchaseDate:'',renewDate:'',duration:'',panelUrl:'',username:'',password:'',specs:''},dns:{nameservers:'',records:''},site:{url:'',adminUser:'',adminPass:'',configPass:''},email:{address:'',password:'',smtp:''},database:{name:'',user:'',password:'',host:''},ftp:{host:'',user:'',password:'',port:''},ssl:{expiryDate:'',issuer:''}},notes:''}}
function normalizeProject(raw){const p=blankProject(raw?.name||'پروژه بدون نام');return {...p,...raw,id:raw?.id||p.id,links:{...p.links,...(raw?.links||{})},access:{...p.access,...(raw?.access||{})},technical:{...p.technical,...(raw?.technical||{}),domain:{...p.technical.domain,...(raw?.technical?.domain||{})},hosting:{...p.technical.hosting,...(raw?.technical?.hosting||{})},dns:{...p.technical.dns,...(raw?.technical?.dns||{})},site:{...p.technical.site,...(raw?.technical?.site||{})},email:{...p.technical.email,...(raw?.technical?.email||{})},database:{...p.technical.database,...(raw?.technical?.database||{})},ftp:{...p.technical.ftp,...(raw?.technical?.ftp||{})},ssl:{...p.technical.ssl,...(raw?.technical?.ssl||{})}}}}
function loadProjects(){if(!storage)return [];try{const raw=storage.getItem(STORAGE_KEY);const data=raw?JSON.parse(raw):[];return Array.isArray(data)?data.map(normalizeProject):[]}catch{return []}}
function persist(){if(!storage){setSaveState('حافظه مرورگر در دسترس نیست',true);return false}try{storage.setItem(STORAGE_KEY,JSON.stringify(projects));setSaveState('ذخیره شد');return true}catch{setSaveState('ذخیره نشد',true);showToast('فضای ذخیره‌سازی مرورگر در دسترس نیست');return false}}
function queuePersist(){setSaveState('در حال ذخیره...');clearTimeout(saveTimer);saveTimer=setTimeout(persist,260)}
function setSaveState(text,warn=false){const el=document.getElementById('save-state');if(!el)return;el.innerHTML=`<span class="save-dot ${warn?'warn':''}"></span><span>${text}</span>`}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function get(obj,path){return path.split('.').reduce((v,key)=>v?.[key],obj)}
function set(obj,path,value){const keys=path.split('.');const last=keys.pop();const target=keys.reduce((v,key)=>v[key],obj);target[last]=value}
function showToast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.classList.remove('show'),2400)}
function daysUntil(date){if(!date)return null;const target=new Date(date+'T00:00:00');if(Number.isNaN(target.getTime()))return null;const now=new Date();now.setHours(0,0,0,0);return Math.round((target-now)/86400000)}
function dateLabel(date){if(!date)return 'تاریخی ثبت نشده';const d=daysUntil(date);if(d===null)return 'تاریخ نامعتبر';if(d<0)return `${Math.abs(d)} روز پیش`;if(d===0)return 'امروز';return `${d} روز مانده`}
function statusSelect(proj){return `<select data-path="status"><option value="active" ${proj.status==='active'?'selected':''}>در حال انجام</option><option value="planning" ${proj.status==='planning'?'selected':''}>در برنامه</option><option value="paused" ${proj.status==='paused'?'selected':''}>متوقف</option><option value="archived" ${proj.status==='archived'?'selected':''}>آرشیو</option></select>`}
function field(label,path,proj,placeholder=''){return `<div class="field"><label>${label}</label><input data-path="${path}" type="text" value="${esc(get(proj,path))}" placeholder="${esc(placeholder)}"></div>`}
function dateField(label,path,proj){return `<div class="field"><label>${label}</label><input data-path="${path}" type="date" value="${esc(get(proj,path))}"></div>`}
function textarea(label,path,proj,full=true){return `<div class="field ${full?'full':''}"><label>${label}</label><textarea data-path="${path}">${esc(get(proj,path))}</textarea></div>`}
function passwordField(label,path,proj){const id='pw_'+path.replace(/\./g,'_')+'_'+proj.id;return `<div class="field"><label>${label}</label><div class="password-wrap"><input id="${id}" data-path="${path}" type="password" value="${esc(get(proj,path))}" autocomplete="off"><div class="password-actions"><button class="icon-btn" type="button" data-toggle="${id}" title="نمایش یا مخفی کردن">👁</button><button class="icon-btn" type="button" data-copy="${id}" title="کپی">⧉</button></div></div></div>`}
function technicalGroup(title,body){return `<div class="technical-group"><h4>${title}</h4><div class="field-grid">${body}</div></div>`}

function renderSidebar(){const list=document.getElementById('project-list');document.getElementById('project-count').textContent=`${projects.length.toLocaleString('fa-IR')} پروژه`;const filtered=projects.filter(p=>!searchTerm||(p.name+' '+(p.technical?.domain?.name||'')).toLowerCase().includes(searchTerm.toLowerCase()));if(!filtered.length){list.innerHTML=`<div class="sidebar-empty">${projects.length?'چیزی پیدا نشد.':'هنوز پروژه‌ای ثبت نشده.<br>با «＋ جدید» شروع کن.'}</div>`;return}list.innerHTML=filtered.map(p=>{const domain=p.technical?.domain?.name||p.links?.site||'بدون لینک';return `<div class="project-item ${p.id===selectedId?'active':''}" data-id="${esc(p.id)}"><div class="project-name">${esc(p.name)}</div><div class="project-meta">${esc(domain)}</div><div class="badges"><span class="badge ${STATUS_CLASS[p.status]||'active'}">${STATUS_LABELS[p.status]||STATUS_LABELS.active}</span>${p.nextDate?`<span class="badge">${dateLabel(p.nextDate)}</span>`:''}</div></div>`}).join('');list.querySelectorAll('.project-item').forEach(el=>el.addEventListener('click',()=>{selectedId=el.dataset.id;renderAll()}))}

function renderMain(){const main=document.getElementById('main');const proj=projects.find(p=>p.id===selectedId);if(!proj){main.innerHTML='<div class="empty"><div class="empty-inner"><div class="empty-mark">⌂</div><h2>دفتر پروژه‌ات را بساز</h2><p>اطلاعات فقط در همین مرورگر ذخیره می‌شود. برای پشتیبان‌گیری می‌توانی خروجی رمزگذاری‌شده بگیری.</p><button class="btn btn-primary" id="empty-new" type="button">＋ ساخت پروژه اول</button></div></div>';document.getElementById('empty-new').addEventListener('click',newProject);return}
main.innerHTML=`<div class="project-head"><div class="project-head-main"><input class="name-input" data-path="name" value="${esc(proj.name)}" aria-label="نام پروژه"><textarea class="desc-input" data-path="description" placeholder="در یک جمله بگو این پروژه چیست...">${esc(proj.description)}</textarea></div><div class="project-head-actions"><button class="btn btn-danger" id="delete-project" type="button">🗑 حذف</button></div></div>
<div class="quick-grid"><div class="card quick-card"><label>وضعیت</label><strong class="status-${STATUS_CLASS[proj.status]||'active'}">${STATUS_LABELS[proj.status]||STATUS_LABELS.active}</strong><small>از فرم اصلی تغییر بده</small></div><div class="card quick-card"><label>تاریخ مهم بعدی</label><strong>${dateLabel(proj.nextDate)}</strong><small>${proj.nextDate||'ثبت نشده'}</small></div><div class="card quick-card"><label>وب‌سایت</label><strong>${esc(proj.links.site||'ثبت نشده')}</strong><small>لینک اصلی پروژه</small></div><div class="card quick-card"><label>ذخیره‌سازی</label><strong class="status-active">محلی</strong><small>بدون ارسال به سرور</small></div></div>
<section class="card"><div class="card-head"><div><h3><span class="card-icon">◆</span> اطلاعات اصلی</h3><p>چیزهایی که بیشتر از همه لازم داری</p></div></div><div class="field-grid"><div class="field"><label>وضعیت پروژه</label>${statusSelect(proj)}</div>${dateField('تاریخ مهم بعدی','nextDate',proj)}${field('کار بعدی','nextAction',proj,'مثلاً آماده‌سازی نسخه جدید')}${field('وب‌سایت','links.site',proj,'https://example.ir')}${field('مخزن یا لینک پروژه','links.repo',proj,'https://github.com/...')}${field('پنل یا لینک مدیریت','links.admin',proj,'https://...')}</div></section>
<section class="card"><div class="card-head"><div><h3><span class="card-icon">●</span> ورود اصلی</h3><p>یک دسترسی پرکاربرد را اینجا نگه دار</p></div></div><div class="field-grid">${field('عنوان دسترسی','access.label',proj,'مثلاً DirectAdmin')}${field('آدرس ورود','access.url',proj,'https://...')}${field('نام کاربری','access.username',proj)}${passwordField('رمز عبور','access.password',proj)}</div></section>
<details class="technical"><summary>جزئیات فنی (اختیاری)</summary><div class="technical-body">${technicalGroup('دامنه',`${field('نام دامنه','technical.domain.name',proj,'example.ir')}${field('ثبت‌کننده','technical.domain.registrar',proj)}${dateField('تاریخ خرید','technical.domain.purchaseDate',proj)}${dateField('تمدید بعدی','technical.domain.renewDate',proj)}${field('مدت خرید','technical.domain.duration',proj,'مثلاً ۱ سال')}${field('آدرس پنل','technical.domain.panelUrl',proj,'https://...')}${field('نام کاربری پنل','technical.domain.username',proj)}${passwordField('رمز پنل','technical.domain.password',proj)}`)}${technicalGroup('هاست',`${field('ارائه‌دهنده','technical.hosting.provider',proj)}${dateField('تاریخ خرید','technical.hosting.purchaseDate',proj)}${dateField('تمدید بعدی','technical.hosting.renewDate',proj)}${field('مدت خرید','technical.hosting.duration',proj,'مثلاً ۱ سال')}${field('آدرس پنل','technical.hosting.panelUrl',proj,'https://...')}${field('نام کاربری','technical.hosting.username',proj)}${passwordField('رمز عبور','technical.hosting.password',proj)}${textarea('مشخصات هاست','technical.hosting.specs',proj,true)}`)}${technicalGroup('DNS و SSL',`${textarea('Nameserverها','technical.dns.nameservers',proj)}${textarea('رکوردهای DNS','technical.dns.records',proj)}${dateField('تاریخ انقضای SSL','technical.ssl.expiryDate',proj)}${field('صادرکننده SSL','technical.ssl.issuer',proj)}`)}${technicalGroup('دسترسی‌های تخصصی',`${field('آدرس سایت فنی','technical.site.url',proj,'https://...')}${field('نام کاربری ادمین','technical.site.adminUser',proj)}${passwordField('رمز ادمین','technical.site.adminPass',proj)}${passwordField('رمز config','technical.site.configPass',proj)}${field('آدرس ایمیل','technical.email.address',proj)}${passwordField('رمز ایمیل','technical.email.password',proj)}${textarea('SMTP / IMAP','technical.email.smtp',proj)}${field('نام دیتابیس','technical.database.name',proj)}${field('کاربر دیتابیس','technical.database.user',proj)}${passwordField('رمز دیتابیس','technical.database.password',proj)}${field('هاست دیتابیس','technical.database.host',proj,'localhost')}${field('هاست FTP / SSH','technical.ftp.host',proj)}${field('کاربر FTP / SSH','technical.ftp.user',proj)}${passwordField('رمز FTP / SSH','technical.ftp.password',proj)}${field('پورت','technical.ftp.port',proj,'21 یا 22')}`)}</div></details>
<section class="card notes"><div class="card-head"><div><h3><span class="card-icon">✎</span> یادداشت‌ها</h3><p>تصمیم‌ها، لینک‌های موقت و چیزهایی که نباید فراموش شوند</p></div></div>${textarea('یادداشت آزاد','notes',proj,true)}<div class="local-note">این ابزار آفلاین و محلی است؛ اطلاعات پروژه به سرور ارسال نمی‌شود. برای جابه‌جایی بین دستگاه‌ها از خروجی رمزگذاری‌شده استفاده کن.</div></section><div class="footer-note">ذخیره خودکار پس از هر تغییر انجام می‌شود.</div>`;
wireMain(proj)}

function wireMain(proj){const main=document.getElementById('main');main.querySelectorAll('[data-path]').forEach(el=>{const evt=el.tagName==='SELECT'||el.type==='date'?'change':'input';el.addEventListener(evt,()=>{set(proj,el.dataset.path,el.value);queuePersist();if(['name','status','nextDate','links.site','technical.domain.name'].includes(el.dataset.path)){renderSidebar();if(el.dataset.path==='status'){const card=main.querySelector('.quick-card strong');if(card){card.textContent=STATUS_LABELS[proj.status];card.className='status-'+STATUS_CLASS[proj.status]}}}})});main.querySelectorAll('[data-toggle]').forEach(btn=>btn.addEventListener('click',()=>{const input=document.getElementById(btn.dataset.toggle);input.type=input.type==='password'?'text':'password'}));main.querySelectorAll('[data-copy]').forEach(btn=>btn.addEventListener('click',()=>{const input=document.getElementById(btn.dataset.copy);copyText(input.value);showToast('کپی شد')}));document.getElementById('delete-project').addEventListener('click',()=>{if(!confirm(`پروژه «${proj.name}» حذف شود؟`))return;projects=projects.filter(p=>p.id!==proj.id);selectedId=projects[0]?.id||null;persist();renderAll();showToast('پروژه حذف شد')})}
function renderAll(){renderSidebar();renderMain()}
function newProject(){const overlay=document.createElement('div');overlay.className='modal-overlay';overlay.innerHTML='<div class="modal"><h3>پروژه جدید</h3><p>یک نام کوتاه برای پروژه وارد کن.</p><input id="new-project-name" type="text" placeholder="مثلاً EMPY یا فروشگاه آنلاین" autocomplete="off"><div class="modal-actions"><button class="btn" id="new-project-cancel" type="button">انصراف</button><button class="btn btn-primary" id="new-project-ok" type="button">ساخت پروژه</button></div></div>';document.body.appendChild(overlay);const input=overlay.querySelector('#new-project-name');const close=()=>overlay.remove();const create=()=>{const name=input.value.trim();if(!name){input.focus();return}const p=blankProject(name);projects.unshift(p);selectedId=p.id;persist();close();renderAll();showToast('پروژه ساخته شد')};input.focus();overlay.querySelector('#new-project-cancel').addEventListener('click',close);overlay.querySelector('#new-project-ok').addEventListener('click',create);input.addEventListener('keydown',e=>{if(e.key==='Enter')create();if(e.key==='Escape')close()})}
function copyText(value){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(value).catch(()=>fallbackCopy(value))}else fallbackCopy(value)}
function fallbackCopy(value){const el=document.createElement('textarea');el.value=value;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();try{document.execCommand('copy')}catch{}el.remove()}

async function deriveKey(passphrase,salt){const enc=new TextEncoder();const base=await crypto.subtle.importKey('raw',enc.encode(passphrase),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptData(data,passphrase){const enc=new TextEncoder();const salt=crypto.getRandomValues(new Uint8Array(16));const iv=crypto.getRandomValues(new Uint8Array(12));const key=await deriveKey(passphrase,salt);const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(data)));return JSON.stringify({v:2,salt:btoa(String.fromCharCode(...salt)),iv:btoa(String.fromCharCode(...iv)),data:btoa(String.fromCharCode(...new Uint8Array(cipher)))})}
async function decryptData(payload,passphrase){const p=JSON.parse(payload);const salt=Uint8Array.from(atob(p.salt),c=>c.charCodeAt(0));const iv=Uint8Array.from(atob(p.iv),c=>c.charCodeAt(0));const data=Uint8Array.from(atob(p.data),c=>c.charCodeAt(0));const key=await deriveKey(passphrase,salt);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);return JSON.parse(new TextDecoder().decode(plain))}
function passphraseModal(title,hint){return new Promise(resolve=>{const overlay=document.createElement('div');overlay.className='modal-overlay';overlay.innerHTML=`<div class="modal"><h3>${title}</h3><p>${hint}</p><input id="passphrase" type="password" placeholder="رمز عبور" autocomplete="off"><div class="modal-actions"><button class="btn" id="pass-cancel" type="button">انصراف</button><button class="btn btn-primary" id="pass-ok" type="button">تایید</button></div></div>`;document.body.appendChild(overlay);const input=overlay.querySelector('#passphrase');const close=value=>{overlay.remove();resolve(value)};input.focus();overlay.querySelector('#pass-ok').addEventListener('click',()=>close(input.value||null));overlay.querySelector('#pass-cancel').addEventListener('click',()=>close(null));input.addEventListener('keydown',e=>{if(e.key==='Enter')close(input.value||null);if(e.key==='Escape')close(null)})})}
document.getElementById('btn-new').addEventListener('click',newProject);document.getElementById('search').addEventListener('input',e=>{searchTerm=e.target.value.trim().toLowerCase();renderSidebar()});document.getElementById('btn-export').addEventListener('click',async()=>{if(!projects.length){showToast('هنوز پروژه‌ای برای خروجی نیست');return}const pass=await passphraseModal('رمز فایل پشتیبان','این رمز فقط برای رمزگذاری فایل خروجی است و جایی ذخیره نمی‌شود.');if(!pass)return;try{const encrypted=await encryptData(projects,pass);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([encrypted],{type:'application/json'}));a.download=`project-vault-backup-${new Date().toISOString().slice(0,10)}.vault`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);showToast('پشتیبان رمزگذاری‌شده آماده شد')}catch{showToast('ساخت پشتیبان ممکن نشد')}});document.getElementById('btn-import').addEventListener('click',()=>document.getElementById('file-input').click());document.getElementById('file-input').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const pass=await passphraseModal('رمز فایل پشتیبان','رمزی را وارد کن که هنگام خروجی گرفتن استفاده شد.');if(!pass)return;const restored=await decryptData(await file.text(),pass);if(!Array.isArray(restored))throw Error('bad format');if(projects.length&&!confirm('پروژه‌های فعلی جایگزین شوند؟'))projects=projects.concat(restored.map(normalizeProject));else projects=restored.map(normalizeProject);selectedId=projects[0]?.id||null;persist();renderAll();showToast('بازیابی با موفقیت انجام شد')}catch{showToast('رمز اشتباه است یا فایل معتبر نیست')}finally{e.target.value='' }});
renderAll();if(storage)setSaveState(projects.length?'ذخیره‌شده':'آماده');
</script>
